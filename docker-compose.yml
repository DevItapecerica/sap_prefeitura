services:
  api:
    image: node:18
    container_name: sap_prefeitura
    build:
      context: ./
      dockerfile: ./Dockerfile
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.09'
          memory: 512M
        reservations:
          memory: 256M
    environment:
      NODE_ENV: ${NODE_ENV}
      APPLICATION_PORT: ${APPLICATION_PORT}
      API_KEY: ${API_KEY}
      DATABASE_URL: ${DATABASE_URL}

      SECRET_KEY: ${SECRET_KEY}
      FT_APP_API_HOST: ${FT_APP_API_HOST}
      FT_APP_API_KEY: ${FT_APP_API_KEY}

      MAIL_ADRESS: ${MAIL_ADRESS}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_HOST: ${MAIL_HOST}
    ports:
      - 3000
    networks:
      - dokploy-network
networks:
  dokploy-network:
    external: true
