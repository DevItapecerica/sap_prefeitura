services:
  db:
    image: mariadb:10.11
    container_name: sap_prefeitura_db
    environment:
      MARIADB_USER: ${DATABASE_USER}
      MARIADB_PASSWORD: ${DATABASE_KEY}
      MARIADB_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DATABASE_NAME}
    exports:
      - 3306
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u${DATABASE_USER} -p${DATABASE_KEY} || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  
  sap:
    image: node:18
    restart: "on-failure:3"
    container_name: sap_prefeitura
    build:
      context: ./
      dockerfile: ./Dockerfile
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}

      PDF_API_URL: ${PDF_API_URL}
      PDF_API_KEY: ${PDF_API_KEY}

      MAIL_ADRESS: ${MAIL_ADRESS}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_HOST: ${MAIL_HOST}

      CORS_ORIGINS: ${CORS_ORIGINS}

      APPLICATION_PORT: 3000
    exports:
      - 3000
    depends_on:
      - db
    networks:
      - dokploy-network
networks:
  dokploy-network:
    external: true